# Build Bambi on every push and pull request, and manually from the Actions tab.
# Without credentials: local.properties is not tracked, so the APK contains no preloaded keys
# (equivalent to seedKeys=false) and is signed with the debug key. This validates the build; it does not publish it.
name: Build

on:
  push:
    branches: [cinefran, cinefran-next, cinefran-stremio]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish permanently signed CINEFRAN release (requires repository secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # On Windows, git may check out gradlew without the executable bit.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --no-build-cache clean assembleDebug :core:model:test :core:domain:test testDebugUnitTest 2>&1 | tee gradle-build.log; then
              exit 0
            fi
            # Retry only dependency/plugin download failures; do not hide compile or test failures.
            if ! grep -Eq 'was not found in any of the following sources|Could not (resolve|download|GET|HEAD)' gradle-build.log || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient dependency resolution failure: retry $attempt"
            sleep 15
          done

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee apk-identity.txt
          grep -F "package: name='com.cinefran.tv.debug'" apk-identity.txt
          grep -F "versionCode='116'" apk-identity.txt
          grep -F "versionName='0.3.6-pruebas'" apk-identity.txt
          mkdir -p verified-apk
          cp "$APK" verified-apk/CINEFRAN-Stremio-0.3.6.apk
          sha256sum verified-apk/CINEFRAN-Stremio-0.3.6.apk | tee verified-apk/SHA256.txt
          cp apk-identity.txt verified-apk/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CINEFRAN-Stremio-0.3.6
          path: verified-apk/
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/cinefran-stremio' }}
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure permanent signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CINEFRAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CINEFRAN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CINEFRAN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CINEFRAN_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.CINEFRAN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing CINEFRAN_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing CINEFRAN_STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing CINEFRAN_KEY_PASSWORD}"
          : "${KEY_ALIAS:?Missing CINEFRAN_KEY_ALIAS}"
          : "${EXPECTED_CERT:?Missing CINEFRAN_CERT_SHA256}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinefran.p12"
          printf 'releaseStoreFile=%s\nreleaseStorePassword=%s\nreleaseKeyPassword=%s\nreleaseKeyAlias=%s\nseedKeys=false\n' "$RUNNER_TEMP/cinefran.p12" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > local.properties
          printf '1' > .public_build
      - name: Build signed release
        run: chmod +x gradlew && ./gradlew --no-daemon :app:assembleRelease
      - name: Verify package and signing certificate
        shell: bash
        env:
          EXPECTED_CERT: ${{ vars.CINEFRAN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.cinefran.tv' versionCode='116' versionName='0.3.6'"
          ACTUAL=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          NORMALIZED=$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "$NORMALIZED"
          mkdir -p "$RUNNER_TEMP/cinefran-release"
          cp "$APK" "$RUNNER_TEMP/cinefran-release/CINEFRAN.apk"
          (cd "$RUNNER_TEMP/cinefran-release" && sha256sum CINEFRAN.apk > SHA256.txt)
      - name: Publish version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.6 "$RUNNER_TEMP/cinefran-release/CINEFRAN.apk" "$RUNNER_TEMP/cinefran-release/SHA256.txt" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CINEFRAN 0.3.6" --notes "Firma permanente, copia de seguridad cifrada y actualizaciones verificadas." --latest
      - name: Remove signing material
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/cinefran.p12"
