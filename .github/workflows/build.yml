# Build Bambi on every push and pull request, and manually from the Actions tab.
# Without credentials: local.properties is not tracked, so the APK contains no preloaded keys
# (equivalent to seedKeys=false) and uses a disposable debug key. Never distribute that APK as an update.
# Publication requires the permanent CINEFRAN certificate and successful validation.
name: Build

on:
  push:
    branches: [cinefran, cinefran-next, cinefran-stremio]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish permanently signed CINEFRAN release (requires repository secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # On Windows, git may check out gradlew without the executable bit.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: '-Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2'
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --no-build-cache clean assembleDebug :core:model:test :core:domain:test testDebugUnitTest 2>&1 | tee gradle-build.log; then
              exit 0
            fi
            # Retry only dependency/plugin download failures; do not hide compile or test failures.
            if ! grep -Eq 'was not found in any of the following sources|Could not (resolve|download|GET|HEAD)|MavenArtifactFetcher.java' gradle-build.log || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient dependency resolution failure: retry $attempt"
            sleep 15
          done

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee apk-identity.txt
          grep -F "package: name='com.cinefran.tv.debug'" apk-identity.txt
          VERSION=$(awk -F'"' '/versionName = / {print $2; exit}' app/build.gradle.kts)
          CODE=$(awk '/^[[:space:]]*versionCode = / {print $3; exit}' app/build.gradle.kts)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CODE" =~ ^[0-9]+$ ]]
          grep -F "versionCode='$CODE'" apk-identity.txt
          grep -F "versionName='$VERSION-pruebas'" apk-identity.txt
          mkdir -p verified-apk
          cp "$APK" "verified-apk/CINEFRAN-DEBUG-$VERSION.apk"
          (cd verified-apk && sha256sum "CINEFRAN-DEBUG-$VERSION.apk" > SHA256.txt)
          echo "CINEFRAN_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp apk-identity.txt verified-apk/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CINEFRAN-DEBUG-${{ env.CINEFRAN_VERSION }}
          path: verified-apk/
          retention-days: 14

  publish:
    if: ${{ github.ref == 'refs/heads/cinefran-stremio' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check publication prerequisites
        id: ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_BUNDLE: ${{ secrets.CINEFRAN_SIGNING }}
          LEGACY_KEY: ${{ secrets.CINEFRAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/versionName = / {print $2; exit}' app/build.gradle.kts)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ -z "$SIGNING_BUNDLE" ] && [ -z "$LEGACY_KEY" ]; then
            echo "::notice::Configure the CINEFRAN_SIGNING repository secret, then rerun all jobs."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::This version is already published. Increment versionCode and versionName before releasing again."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure permanent signing
        if: steps.ready.outputs.publish == 'true'
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.CINEFRAN_SIGNING }}
          KEYSTORE_BASE64: ${{ secrets.CINEFRAN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CINEFRAN_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CINEFRAN_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CINEFRAN_KEY_ALIAS }}
          EXPECTED_CERT: ${{ vars.CINEFRAN_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_BUNDLE" ]; then
            KEYSTORE_BASE64=$(printf '%s' "$SIGNING_BUNDLE" | jq -er .keystore_base64)
            STORE_PASSWORD=$(printf '%s' "$SIGNING_BUNDLE" | jq -er .password)
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS=$(printf '%s' "$SIGNING_BUNDLE" | jq -er .alias)
            echo "::add-mask::$KEYSTORE_BASE64"
            echo "::add-mask::$STORE_PASSWORD"
            EXPECTED_CERT="a142d8905f042560fb43a15882763009a832429c01b325c90b88ccc38fd8cedb"
          fi
          printf 'CINEFRAN_EXPECTED_CERT=%s\n' "$EXPECTED_CERT" >> "$GITHUB_ENV"
          : "${KEYSTORE_BASE64:?Missing CINEFRAN_KEYSTORE_BASE64}"
          : "${STORE_PASSWORD:?Missing CINEFRAN_STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing CINEFRAN_KEY_PASSWORD}"
          : "${KEY_ALIAS:?Missing CINEFRAN_KEY_ALIAS}"
          : "${EXPECTED_CERT:?Missing CINEFRAN_CERT_SHA256}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinefran.p12"
          # Verify the public certificate in the supplied keystore before building.
          export STORE_PASSWORD
          keytool -exportcert -storetype PKCS12 -keystore "$RUNNER_TEMP/cinefran.p12" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD -file "$RUNNER_TEMP/cinefran-public.cer"
          KEYSTORE_CERT=$(sha256sum "$RUNNER_TEMP/cinefran-public.cer" | awk '{print $1}')
          NORMALIZED=$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          echo "Expected certificate: $NORMALIZED"
          echo "Keystore certificate: $KEYSTORE_CERT"
          if [ "$KEYSTORE_CERT" != "$NORMALIZED" ]; then
            echo "::error::The configured keystore certificate does not match the permanent certificate."
            exit 1
          fi
          printf 'releaseStoreFile=%s\nreleaseStorePassword=%s\nreleaseKeyPassword=%s\nreleaseKeyAlias=%s\nseedKeys=false\n' "$RUNNER_TEMP/cinefran.p12" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > local.properties
          printf '1' > .public_build
      - name: Build signed release
        if: steps.ready.outputs.publish == 'true'
        run: chmod +x gradlew && ./gradlew --no-daemon --no-build-cache :app:assembleRelease
      - name: Verify package and signing certificate
        if: steps.ready.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          VERSION=$(awk -F'"' '/versionName = / {print $2; exit}' app/build.gradle.kts)
          CODE=$(awk '/^[[:space:]]*versionCode = / {print $3; exit}' app/build.gradle.kts)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CODE" =~ ^[0-9]+$ ]]
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.cinefran.tv' versionCode='$CODE' versionName='$VERSION'"
          echo "CINEFRAN_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Print public verification diagnostics; never bypass signature verification.
          if ! "$SIGNER" verify --verbose --print-certs "$APK" 2>&1 | tee "$RUNNER_TEMP/cinefran-certificate.txt"; then
            echo "::error::Android apksigner rejected the APK."
            exit 1
          fi
          ACTUAL=$(awk 'tolower($0) ~ /^signer #1 certificate( #1)? sha-256 digest:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/[:[:space:]]/, ""); print tolower($0)}' "$RUNNER_TEMP/cinefran-certificate.txt")
          NORMALIZED=$(printf '%s' "$CINEFRAN_EXPECTED_CERT" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          echo "Expected certificate: $NORMALIZED"
          echo "APK certificate: $ACTUAL"
          if [[ ! "$ACTUAL" =~ ^[0-9a-f]{64}$ ]] || [ "$ACTUAL" != "$NORMALIZED" ]; then
            echo "::error::APK certificate missing or different from the permanent signing certificate."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/cinefran-release"
          cp "$APK" "$RUNNER_TEMP/cinefran-release/CINEFRAN.apk"
          (cd "$RUNNER_TEMP/cinefran-release" && sha256sum CINEFRAN.apk > SHA256.txt)
      - name: Upload permanently signed APK
        if: steps.ready.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CINEFRAN-SIGNED-${{ env.CINEFRAN_VERSION }}
          path: ${{ runner.temp }}/cinefran-release/
          retention-days: 14
      - name: Publish version
        if: steps.ready.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$CINEFRAN_VERSION" "$RUNNER_TEMP/cinefran-release/CINEFRAN.apk" "$RUNNER_TEMP/cinefran-release/SHA256.txt" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CINEFRAN $CINEFRAN_VERSION" --notes "Firma permanente, copia de seguridad cifrada y actualizaciones verificadas." --latest
      - name: Remove signing material
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/cinefran.p12"
