# Build Bambi on every push and pull request, and manually from the Actions tab.
# Without credentials: local.properties is not tracked, so the APK contains no preloaded keys
# (equivalent to seedKeys=false) and is signed with the debug key. This validates the build; it does not publish it.
name: Build

on:
  push:
    branches: [cinefran, cinefran-next, cinefran-stremio]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # On Windows, git may check out gradlew without the executable bit.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK and run unit tests
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --no-build-cache clean assembleDebug :core:model:test :core:domain:test testDebugUnitTest 2>&1 | tee gradle-build.log; then
              exit 0
            fi
            # Retry only dependency/plugin download failures; do not hide compile or test failures.
            if ! grep -Eq 'was not found in any of the following sources|Could not (resolve|download|GET|HEAD)' gradle-build.log || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient dependency resolution failure: retry $attempt"
            sleep 15
          done

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee apk-identity.txt
          grep -F "package: name='com.cinefran.tv.debug'" apk-identity.txt
          grep -F "versionCode='114'" apk-identity.txt
          grep -F "versionName='0.3.4-pruebas'" apk-identity.txt
          mkdir -p verified-apk
          cp "$APK" verified-apk/CINEFRAN-Stremio-0.3.4.apk
          sha256sum verified-apk/CINEFRAN-Stremio-0.3.4.apk | tee verified-apk/SHA256.txt
          cp apk-identity.txt verified-apk/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CINEFRAN-Stremio-0.3.4
          path: verified-apk/
          retention-days: 14
